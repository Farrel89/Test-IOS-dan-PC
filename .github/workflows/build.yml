name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lazurite
      - shell: pwsh
        run: Invoke-WebRequest -Uri "https://github.com/devendrn/newb-shader/releases/download/dev/shaderc-win-x64.exe" -OutFile shaderc.exe
      - run: lazurite build shader -p android windows ios -o output --shaderc "${{ github.workspace }}/shaderc.exe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: materials
          path: output
